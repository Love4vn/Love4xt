name: Update M3U Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Không chỉ định ref, để actions/checkout tự lấy nhánh mặc định
          # Nếu vẫn lỗi, có thể thêm: ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run M3U_list.py
        run: python M3U_list.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          # Xác định tên nhánh hiện tại (main hoặc master)
          BRANCH=$(git branch --show-current)
          if [ -z "$BRANCH" ]; then
            # Nếu không lấy được, thử các tên phổ biến
            if git show-ref --verify --quiet refs/heads/main; then
              BRANCH="main"
            elif git show-ref --verify --quiet refs/heads/master; then
              BRANCH="master"
            else
              echo "Could not determine branch name"
              exit 1
            fi
          fi
          echo "Current branch: $BRANCH"
          
          # Kiểm tra file thay đổi
          if git diff --quiet output.m3u; then
            echo "No changes to output.m3u"
            exit 0
          fi
          
          git add output.m3u
          git commit -m "Auto-update playlist $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin "$BRANCH"
          git push origin "$BRANCH"
